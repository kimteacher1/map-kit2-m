<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAP KIT & LAB (태블릿 버전)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        :root {
            --bg-color: #FFF0F5;
            --box-color: #FFFFFF;
            --primary-color: #5DADE2;
            --text-color: #4A4A4A;
        }

        /* 💡 키보드 가림 방지: 화면 상단 정렬 및 패딩 적용 */
        body { font-family: 'Jua', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding-top: 5vh; overflow-y: auto; transition: background 0.5s; -webkit-overflow-scrolling: touch; touch-action: pan-y; }

        .container { background: var(--box-color); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; max-width: 650px; width: 95%; margin-bottom: 30px; box-sizing: border-box; }
        
        .main-title { color: var(--primary-color); margin-top: 0; margin-bottom: 20px; font-size: 2.2rem;}
        
        .theme-picker { display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        .theme-btn { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: 0.2s; }
        .theme-btn.active { border-color: #34495E; transform: scale(1.1); }

        .input-group { display: flex; flex-direction: column; gap: 15px; text-align: left; margin-bottom: 25px; width: 100%; box-sizing: border-box;}
        .input-group label { font-size: 1.1rem; color: #7F8C8D; margin-bottom: 5px; display: block; font-weight: bold;}
        
        .row-group { display: flex; gap: 10px; width: 100%; box-sizing: border-box;}
        .input-col { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        
        input, select { padding: 12px; border: 2px solid #E5E7E9; border-radius: 12px; font-family: 'Jua', sans-serif; font-size: 1.2rem; outline: none; width: 100%; box-sizing: border-box; background: white; -webkit-appearance: none; }
        input:focus, select:focus { border-color: var(--primary-color); }

        .btn-submit { background: var(--primary-color); color: white; border: none; padding: 16px; border-radius: 16px; font-size: 1.4rem; font-family: 'Jua', sans-serif; cursor: pointer; transition: 0.2s; width: 100%; box-sizing: border-box; font-weight: bold;}
        .btn-submit:active { transform: scale(0.98); background: #3498DB; }

        #menu-screen { display: none; width: 100%; max-width: 700px; padding: 25px; margin-top: 2vh;}
        
        .section-title { font-size: 1.4rem; color: #7F8C8D; text-align: left; margin-top: 15px; border-bottom: 2px dashed #E5E7E9; padding-bottom: 8px; }
        
        /* 💡 한눈에 들어오는 3x2 그리드 축소 최적화 */
        .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
        .app-card { background: #F8F9F9; border: 2px solid #E5E7E9; border-radius: 16px; padding: 20px 10px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center;}
        .app-card:active { border-color: var(--primary-color); background: #EBF5FB; transform: scale(0.95); }
        .app-icon { font-size: 2.8rem; margin-bottom: 10px; }
        .app-card h2 { margin: 0; font-size: 1.15rem; line-height: 1.3; word-break: keep-all; color: var(--text-color); text-align: center;}
        
        #app-container { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background: white; z-index: 100; }
        iframe { width: 100%; height: 100%; border: none; }
        
        #lesson-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; text-align: center; }
        .modal-content textarea { width: 100%; height: 120px; padding: 15px; border: 2px solid var(--primary-color); border-radius: 12px; font-family: 'Jua', sans-serif; font-size: 1.2rem; margin: 15px 0; resize: none; box-sizing: border-box; line-height:1.5;}
        
        #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255,255,255,0.9); z-index: 10000; justify-content: center; align-items: center; font-size: 1.5rem; color: var(--primary-color); text-align: center; flex-direction: column; gap: 15px;}

        /* 전체화면 모달 (갤러리, 관리자) */
        .full-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; padding-top:0;}
        .full-content { background: white; padding: 25px; border-radius: 20px; width: 95%; max-width: 1000px; height: 90vh; display: flex; flex-direction: column; position: relative; }
        .full-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #E5E7E9; padding-bottom: 10px; margin-bottom: 15px; }
        .full-header h2 { margin: 0; color: var(--primary-color); font-size: 1.8rem;}
        .close-btn { width: 45px; height: 45px; border-radius: 50%; font-size: 1.6rem; background: #FDEBD0; border: none; color: #E74C3C; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        
        .admin-controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; width: 100%; }
        .admin-tabs { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; border-bottom: 1px solid #E5E7E9; padding-bottom: 12px; }
        .admin-tab { padding: 10px 16px; background: #F0F3F4; border: none; border-radius: 12px; font-family: 'Jua', sans-serif; font-size: 1.1rem; cursor: pointer; color: #7F8C8D; transition: 0.2s;}
        .admin-tab.active { background: var(--primary-color); color: white; }
        
        .admin-filters { display: flex; gap: 12px; flex-wrap: wrap; width: 100%; }
        .admin-filter-select, .admin-filter-input { padding: 10px 12px; border-radius: 10px; border: 2px solid var(--primary-color); outline: none; font-family: 'Jua', sans-serif; font-size: 1.1rem; background: white;}
        .admin-filter-select { flex: 1; min-width: 120px; }
        .admin-filter-input { flex: 2; min-width: 180px; }

        .table-container { flex: 1; overflow-y: auto; background: white; border: 2px solid #E5E7E9; border-radius: 12px; -webkit-overflow-scrolling: touch;}
        .admin-table { width: 100%; border-collapse: collapse; text-align: center; }
        .admin-table th { background: #F0F3F4; padding: 12px; font-size: 1.1rem; color: #34495E; position: sticky; top: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); z-index: 2;}
        .admin-table td { padding: 12px; border-bottom: 1px solid #E5E7E9; font-size: 1.05rem; color: #4A4A4A;}

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; overflow-y: auto; flex: 1; padding: 5px; -webkit-overflow-scrolling: touch;}
        .gallery-item { border: 2px solid #E5E7E9; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; background: #FDFDFD; cursor: pointer;}
        .gallery-img { width: 100%; height: 180px; object-fit: cover; border-bottom: 2px solid #E5E7E9; }
        .gallery-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; text-align: left; }

        #detail-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 10001; justify-content: center; align-items: center; }
        .detail-box { background: white; padding: 30px; border-radius: 20px; width: 95%; max-width: 800px; max-height: 95vh; overflow-y: auto; position: relative; display: flex; flex-direction: column; -webkit-overflow-scrolling: touch;}
        .close-detail { position: absolute; top: 15px; right: 15px; width: 45px; height: 45px; border-radius: 50%; font-size: 1.6rem; background: #FDEBD0; border: none; color: #E74C3C; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #detail-title { color: var(--primary-color); margin-top: 0; font-size: 1.6rem; border-bottom: 2px dashed #E5E7E9; padding-bottom: 12px;}
        .detail-img { width: 100%; max-height: 500px; object-fit: contain; background: #F0F3F4; border-radius: 12px; margin-bottom: 15px;}
        .detail-chat-log { white-space: pre-wrap; font-family: sans-serif; font-size: 1.1rem; line-height: 1.6; background: #F8F9F9; padding: 20px; border-radius: 12px; color: #2C3E50; border: 1px solid #E5E7E9; text-align: left; }
        #detail-lesson { background: #FEF9E7; padding: 15px; border-radius: 12px; font-size: 1.2rem; color: #4A4A4A; text-align: left; border: 1px solid #F9E79F; line-height: 1.5;}
    </style>
</head>
<body>

    <div class="container" id="login-screen">
        <h1 class="main-title">MAP KIT & LAB</h1> 
        
        <div class="theme-picker">
            <div class="theme-btn active" style="background: #FFF0F5;" onclick="setTheme('#FFF0F5', this)"></div>
            <div class="theme-btn" style="background: #E8F8F5;" onclick="setTheme('#E8F8F5', this)"></div>
            <div class="theme-btn" style="background: #EBF5FB;" onclick="setTheme('#EBF5FB', this)"></div>
            <div class="theme-btn" style="background: #FEF9E7;" onclick="setTheme('#FEF9E7', this)"></div>
            <div class="theme-btn" style="background: #F4ECF7;" onclick="setTheme('#F4ECF7', this)"></div>
        </div>

        <div class="input-group">
            <label>소속 학교</label>
            <div class="row-group">
                <input type="text" id="school" value="" placeholder="학교명 입력" style="flex: 2;">
                <input type="text" value="초등학교" disabled style="background:#F0F3F4; flex: 1; text-align: center; color:#7F8C8D;">
            </div>
            
            <div class="row-group">
                <div class="input-col"><label>학년</label>
                    <select id="grade">
                        <option value="6학년" selected>6학년</option>
                        <option value="5학년">5학년</option>
                        <option value="4학년">4학년</option>
                        <option value="3학년">3학년</option>
                    </select>
                </div>
                <div class="input-col"><label>반</label><input type="number" id="classNum" value="1" min="1"></div>
                <div class="input-col"><label>번호</label><input type="number" id="studentNum" placeholder="번호"></div>
            </div>

            <label>내 이름</label>
            <input type="text" id="studentName" placeholder="이름을 입력하세요">
        </div>

        <button class="btn-submit" onclick="login()">교실 입장하기</button>
    </div>

    <div class="container" id="menu-screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; border-bottom: 2px dashed #E5E7E9; padding-bottom: 15px;">
            <h1 id="welcome-msg" style="color:var(--primary-color); margin:0; font-size: 1.6rem;">환영합니다!</h1>
            <button class="btn-submit" style="width:auto; padding: 10px 18px; font-size:1.1rem; background:#FFF9E6; color:#D4AC0D; border: 2px solid #F1C40F;" onclick="openGalleryPanel()">🎨 작품 갤러리</button>
        </div>
        
        <div class="section-title" style="margin-top:0;">🗺️ MAP KIT (지도 도구)</div>
        <div class="app-grid">
            <div class="app-card" onclick="openApp('map1.html')"><div class="app-icon">📝</div><h2>백지도<br>그리기</h2></div>
            <div class="app-card" onclick="openApp('map2.html')"><div class="app-icon">💡</div><h2>지도<br>겹치기</h2></div>
            <div class="app-card" onclick="openApp('map6.html')"><div class="app-icon">⏳</div><h2>타임머신<br>역사 지도</h2></div>
        </div>

        <div class="section-title">🤖 MAP LAB (학습 도구)</div>
        <div class="app-grid">
            <div class="app-card" onclick="openApp('map4.html')"><div class="app-icon">🤖</div><h2>맵봇에게<br>물어보기</h2></div>
            <div class="app-card" onclick="openApp('map3.html')"><div class="app-icon">📸</div><h2>백지도<br>메이커</h2></div>
            <div class="app-card" onclick="openApp('map5.html')"><div class="app-icon">📓</div><h2>스마트<br>배움공책</h2></div>
        </div>
        
        <div style="display:flex; justify-content:space-between; margin-top: 30px; gap: 15px;">
            <button class="btn-submit" style="flex:1; background: #95A5A6; padding: 12px; font-size: 1.2rem;" onclick="location.reload()">로그아웃</button>
            <button class="btn-submit" style="flex:1; background: #FDFEFE; color: #7F8C8D; border: 2px solid #D5D8DC; padding: 12px; font-size: 1.2rem;" onclick="openAdminPrompt()">⚙️ 교사용 페이지</button>
        </div>
    </div>

    <div id="app-container"><iframe id="app-frame" src=""></iframe></div>

    <div id="lesson-modal">
        <div class="modal-content">
            <h2 id="modal-title" style="color: var(--primary-color); margin-top:0; font-size:1.8rem;">✨ 배움 기록하기</h2>
            <p id="modal-desc" style="color: #7F8C8D; font-size:1.1rem;">수업 활동을 마치며 알게 된 점이나<br>느낀 점을 기록해서 선생님께 제출하세요!</p>
            <textarea id="lesson-text" placeholder="내용을 터치하여 입력해주세요."></textarea>
            <div style="display: flex; gap: 10px;">
                <button class="btn-submit" style="background: #95A5A6;" onclick="document.getElementById('lesson-modal').style.display='none'">취소</button>
                <button class="btn-submit" onclick="submitData()">제출 및 저장</button>
            </div>
        </div>
    </div>

    <div id="loading-overlay">
        <div style="font-size: 3rem;">🚀</div>
        <div>제출 중입니다...</div>
    </div>

    <!-- 갤러리 패널 -->
    <div id="gallery-modal" class="full-modal">
        <div class="full-content">
            <div class="full-header"><h2>🎨 우리반 작품 갤러리</h2><button class="close-btn" onclick="document.getElementById('gallery-modal').style.display='none'">X</button></div>
            <div class="admin-controls">
                <div class="admin-filters">
                    <select id="gal-school-filter" class="admin-filter-select" onchange="renderGalleryGrid()"><option value="all">🏫 모든 학교</option></select>
                    <select id="gal-grade-filter" class="admin-filter-select" onchange="renderGalleryGrid()"><option value="all">📚 모든 학년</option></select>
                    <select id="gal-class-filter" class="admin-filter-select" onchange="renderGalleryGrid()"><option value="all">🏷️ 모든 반</option></select>
                    <input type="text" id="gal-name-search" class="admin-filter-input" placeholder="🔍 이름 검색" oninput="renderGalleryGrid()">
                </div>
            </div>
            <div id="gallery-loading" style="text-align:center; font-size: 1.5rem; color: var(--primary-color); padding: 30px;">불러오는 중... 🎨</div>
            <div class="gallery-grid" id="gallery-grid" style="display:none;"></div>
        </div>
    </div>

    <!-- 교사용 관리자 패널 -->
    <div id="admin-modal" class="full-modal">
        <div class="full-content">
            <div class="full-header"><h2>⚙️ 교사용 데이터 갤러리</h2><button class="close-btn" onclick="document.getElementById('admin-modal').style.display='none'">X</button></div>
            <div class="admin-controls">
                <div class="admin-tabs">
                    <button class="admin-tab active" onclick="setProgramFilter('전체')">전체 보기</button>
                    <button class="admin-tab" onclick="setProgramFilter('백지도 그리기')">백지도 그리기</button>
                    <button class="admin-tab" onclick="setProgramFilter('지도 겹치기')">지도 겹치기</button>
                    <button class="admin-tab" onclick="setProgramFilter('맵봇 챗봇')">챗봇 대화</button>
                    <button class="admin-tab" onclick="setProgramFilter('배움 공책')">배움 노트</button>
                    <button class="admin-tab" onclick="setProgramFilter('타임머신 역사 지도')">역사 지도</button>
                </div>
                <div class="admin-filters">
                    <select id="school-filter" class="admin-filter-select" onchange="renderAdminTable()"><option value="all">🏫 모든 학교</option></select>
                    <select id="grade-filter" class="admin-filter-select" onchange="renderAdminTable()"><option value="all">📚 모든 학년</option></select>
                    <select id="class-filter" class="admin-filter-select" onchange="renderAdminTable()"><option value="all">🏷️ 모든 반</option></select>
                    <input type="text" id="name-search" class="admin-filter-input" placeholder="🔍 이름 검색" oninput="renderAdminTable()">
                </div>
            </div>
            <div id="admin-loading" style="text-align:center; font-size: 1.5rem; color: var(--primary-color); padding: 30px;">불러오는 중... 🚀</div>
            <div class="table-container" id="admin-grid" style="display:none;">
                <table class="admin-table">
                    <thead><tr><th>일시</th><th>학교</th><th>학년/반/번호</th><th>이름</th><th>과제명</th></tr></thead>
                    <tbody id="admin-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 상세 모달 -->
    <div id="detail-modal">
        <div class="detail-box">
            <button class="close-detail" onclick="document.getElementById('detail-modal').style.display='none'">X</button>
            <h2 id="detail-title">상세 보기</h2>
            <div id="detail-content" style="margin-top:15px; text-align:center;"></div>
            <div id="detail-lesson"></div>
            <div id="detail-actions" style="display:none; margin-top: 15px; text-align: right; border-top: 2px dashed #E5E7E9; padding-top: 15px;">
                <button onclick="deleteCurrentData()" style="background:#E74C3C; color:white; padding:12px 25px; border:none; border-radius:12px; cursor:pointer; font-family:'Jua', sans-serif; font-size: 1.2rem;">🗑️ 데이터 삭제</button>
            </div>
        </div>
    </div>

    <script>
        // 🚨 여기에 선생님의 구글 웹앱 URL을 꼭 넣어주세요!
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwC4iY26IlZdcKIPI0QDIFiKeBPD9n7fBXL2qe0UcalT4SRN9IIm5zuJhtF0lUeimmE4Q/exec"; 

        let studentData = {};
        let currentMapData = { base64: "", appName: "", extraText: "" };
        let serverData = []; let currentProgFilter = '전체'; let isAdminMode = false; let currentDetailItem = null;

        window.addEventListener('load', () => { sessionStorage.clear(); });

        function setTheme(color, btn) {
            document.documentElement.style.setProperty('--bg-color', color);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function login() {
            let school = document.getElementById('school').value.trim();
            school = school.replace(/초등학교/g, '').trim(); 
            const grade = document.getElementById('grade').value;
            const classNum = document.getElementById('classNum').value.trim();
            const studentNum = document.getElementById('studentNum').value.trim();
            const name = document.getElementById('studentName').value.trim();

            if(!school || !classNum || !studentNum || !name) { alert("정보를 모두 입력해주세요!"); return; }

            studentData = { school, grade, classNum, studentNum, name };
            sessionStorage.setItem('userInfo', JSON.stringify(studentData));

            document.getElementById('login-screen').style.display = 'none';
            document.body.style.justifyContent = 'center'; // 로그인창 상단정렬 해제
            document.body.style.paddingTop = '0';
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('welcome-msg').innerText = `${name} 학생, 환영합니다!`;
        }

        function openApp(url) {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            document.getElementById('app-frame').src = url;
        }

        window.closeApp = function() {
            document.getElementById('app-container').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('app-frame').src = "";
        };

        window.handleMapSave = function(base64data, appName, extraText = "") {
            currentMapData.base64 = base64data; currentMapData.appName = appName; currentMapData.extraText = extraText;
            
            const mTitle = document.getElementById('modal-title'); const mDesc = document.getElementById('modal-desc'); const lInput = document.getElementById('lesson-text');

            if(appName === '맵봇 챗봇') {
                mTitle.innerText = "💬 챗봇 대화 기록 제출"; mDesc.innerText = "맵봇과 나눈 대화 기록이 입력되었습니다."; lInput.value = extraText;
            } else {
                mTitle.innerText = "✨ 배움 기록하기"; mDesc.innerText = "수업 활동을 마치며 알게 된 점을 기록해 주세요!"; lInput.value = "";
            }
            document.getElementById('lesson-modal').style.display = 'flex';
        };

        function submitData() {
            const lessonText = document.getElementById('lesson-text').value.trim();
            if(!lessonText && currentMapData.appName !== '맵봇 챗봇') { alert("배움 한 줄을 꼭 적어주세요!"); return; }

            document.getElementById('lesson-modal').style.display = 'none';
            document.getElementById('loading-overlay').style.display = 'flex';

            const payload = {
                school: studentData.school,
                grade: studentData.grade,
                classNum: studentData.classNum,
                studentNum: studentData.studentNum,
                name: studentData.name,
                program: currentMapData.appName,
                lessonText: lessonText,
                imageBase64: currentMapData.base64
            };

            fetch(GOOGLE_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading-overlay').style.display = 'none';
                if(data.status === 'success') {
                    alert("✅ 성공적으로 전송되었습니다!");
                    downloadBackup();
                } else { alert("⚠️ 전송 오류가 발생했습니다."); }
            })
            .catch(error => {
                document.getElementById('loading-overlay').style.display = 'none';
                alert("✅ 전송 완료 (네트워크 지연). 기기에 백업됩니다.");
                downloadBackup();
            });
        }

        function downloadBackup() {
            if(currentMapData.base64) {
                const a = document.createElement('a'); a.href = currentMapData.base64;
                a.download = `MAP_KIT_${studentData.name}_${currentMapData.appName}.jpg`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            }
        }

        // --- 관리자/갤러리 스크립트 ---
        function fetchServerData(callback) {
            fetch(GOOGLE_WEB_APP_URL).then(res => res.json()).then(res => {
                if(res.status === 'success') { serverData = res.data; callback(true); } else { callback(false, "데이터 로드 실패"); }
            }).catch(err => { callback(false, "네트워크 오류"); });
        }

        function openGalleryPanel() {
            isAdminMode = false; document.getElementById('gallery-modal').style.display = 'flex';
            document.getElementById('gallery-loading').style.display = 'block'; document.getElementById('gallery-grid').style.display = 'none';
            fetchServerData((success, errMsg) => {
                if(success) { document.getElementById('gallery-loading').style.display = 'none'; populateFilters('gal-'); renderGalleryGrid(); }
                else { document.getElementById('gallery-loading').innerHTML = `❌ ${errMsg}`; }
            });
        }

        function renderGalleryGrid() {
            const grid = document.getElementById('gallery-grid'); grid.innerHTML = ''; grid.style.display = 'grid';
            const sch = document.getElementById('gal-school-filter').value; const grd = document.getElementById('gal-grade-filter').value;
            const cls = document.getElementById('gal-class-filter').value; const nameQ = document.getElementById('gal-name-search').value.trim().toLowerCase();

            let filtered = serverData.filter(d => ['백지도 그리기', '지도 겹치기', '타임머신 역사 지도', '배움 공책'].includes(d.program));
            if(sch !== 'all') filtered = filtered.filter(d => d.school === sch);
            if(grd !== 'all') filtered = filtered.filter(d => String(d.grade) === String(grd));
            if(cls !== 'all') filtered = filtered.filter(d => String(d.classNum) === String(cls));
            if(nameQ !== '') filtered = filtered.filter(d => (d.name || '').toLowerCase().includes(nameQ));

            if(filtered.length === 0) { grid.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; font-size:1.3rem; color:#95A5A6; padding:40px;">작품이 없습니다.</div>`; return; }

            filtered.forEach(item => {
                const card = document.createElement('div'); card.className = 'gallery-item';
                card.innerHTML = `
                    <img src="${item.imageBase64}" class="gallery-img" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                    <div class="gallery-info">
                        <div style="font-size: 1.2rem; font-weight: bold; color: #4A4A4A;">🧑‍🎓 ${item.grade}-${item.classNum} ${item.name}</div>
                        <div style="font-size: 1rem; color: var(--primary-color);">✨ ${item.program}</div>
                    </div>`;
                card.onclick = () => openDetailModal(item); grid.appendChild(card);
            });
        }

        function openAdminPrompt() {
            const pwd = prompt("교사용 페이지 접속 비밀번호를 입력하세요:");
            if (pwd === "12345678") { isAdminMode = true; openAdminPanel(); } else if (pwd !== null) { alert("비밀번호 불일치"); }
        }

        function openAdminPanel() {
            document.getElementById('admin-modal').style.display = 'flex'; document.getElementById('admin-loading').style.display = 'block';
            document.getElementById('admin-grid').style.display = 'none'; document.getElementById('admin-tbody').innerHTML = '';
            fetchServerData((success, errMsg) => {
                if(success) { document.getElementById('admin-loading').style.display = 'none'; populateFilters(''); setProgramFilter('전체'); }
                else { document.getElementById('admin-loading').innerHTML = `❌ ${errMsg}`; }
            });
        }

        function populateFilters(prefix = '') {
            const sSel = document.getElementById(`${prefix}school-filter`); const gSel = document.getElementById(`${prefix}grade-filter`); const cSel = document.getElementById(`${prefix}class-filter`);
            const schools = [...new Set(serverData.map(d => d.school))].filter(Boolean); const grades = [...new Set(serverData.map(d => d.grade))].filter(Boolean); const classes = [...new Set(serverData.map(d => d.classNum))].filter(Boolean);

            sSel.innerHTML = '<option value="all">🏫 모든 학교</option>'; schools.sort().forEach(s => sSel.innerHTML += `<option value="${s}">${s}초</option>`);
            gSel.innerHTML = '<option value="all">📚 모든 학년</option>'; grades.sort().forEach(g => gSel.innerHTML += `<option value="${g}">${g}</option>`);
            cSel.innerHTML = '<option value="all">🏷️ 모든 반</option>'; classes.sort((a,b)=>a-b).forEach(c => cSel.innerHTML += `<option value="${c}">${c}반</option>`);
        }

        function setProgramFilter(prog) {
            currentProgFilter = prog;
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.classList.remove('active');
                if(tab.innerText === prog || (prog === '전체' && tab.innerText === '전체 보기')) tab.classList.add('active');
                else if (prog === '맵봇 챗봇' && tab.innerText === '챗봇 대화') tab.classList.add('active');
                else if (prog === '배움 공책' && tab.innerText === '배움 노트') tab.classList.add('active');
                else if (prog === '타임머신 역사 지도' && tab.innerText === '역사 지도') tab.classList.add('active');
            }); renderAdminTable();
        }

        function renderAdminTable() {
            const tbody = document.getElementById('admin-tbody'); tbody.innerHTML = ''; document.getElementById('admin-grid').style.display = 'block';
            const sch = document.getElementById('school-filter').value; const grd = document.getElementById('grade-filter').value;
            const cls = document.getElementById('class-filter').value; const nameQ = document.getElementById('name-search').value.trim().toLowerCase();
            
            let filtered = serverData;
            if(currentProgFilter !== '전체') filtered = filtered.filter(d => d.program === currentProgFilter);
            if(sch !== 'all') filtered = filtered.filter(d => d.school === sch);
            if(grd !== 'all') filtered = filtered.filter(d => String(d.grade) === String(grd));
            if(cls !== 'all') filtered = filtered.filter(d => String(d.classNum) === String(cls));
            if(nameQ !== '') filtered = filtered.filter(d => (d.name || '').toLowerCase().includes(nameQ));

            if(filtered.length === 0) { tbody.innerHTML = `<tr><td colspan="5" style="padding:40px; font-size:1.3rem;">조건에 맞는 데이터가 없습니다.</td></tr>`; return; }

            filtered.forEach((item) => {
                const tr = document.createElement('tr');
                let dateStr = ""; if(item.timestamp) { const d = new Date(item.timestamp); dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
                tr.innerHTML = `<td>${dateStr}</td><td>${item.school || '-'}초</td><td>${item.grade}-${item.classNum}-${item.studentNum}</td><td style="font-weight:bold; color:var(--primary-color);">${item.name || '무명'}</td><td><span style="background:#EBF5FB; padding:6px 12px; border-radius:12px;">${item.program || '알 수 없음'}</span></td>`;
                tr.onclick = () => openDetailModal(item); tbody.appendChild(tr);
            });
        }

        function openDetailModal(item) {
            currentDetailItem = item; 
            const modal = document.getElementById('detail-modal'); const title = document.getElementById('detail-title');
            const content = document.getElementById('detail-content'); const lesson = document.getElementById('detail-lesson'); const actions = document.getElementById('detail-actions');

            title.innerText = `🧑‍🎓 ${item.grade} ${item.classNum}반 ${item.name} (${item.program})`; content.innerHTML = ''; lesson.style.display = 'none';

            if(item.program === '맵봇 챗봇') {
                content.innerHTML = `<div class="detail-chat-log">${item.lessonText || '대화 내용 없음'}</div>`;
            } else {
                content.innerHTML = `<img src="${item.imageBase64}" class="detail-img" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">`;
                if(item.lessonText && item.lessonText.trim() !== '') { lesson.innerText = `📝 배움 한 줄: "${item.lessonText}"`; lesson.style.display = 'block'; }
            }
            actions.style.display = isAdminMode ? 'block' : 'none'; modal.style.display = 'flex';
        }

        function deleteCurrentData() {
            if(!currentDetailItem) return;
            const targetName = currentDetailItem.name || '무명';
            const pwd = prompt(`정말 ${targetName} 학생의 결과를 지우시겠습니까?\n비밀번호를 입력하세요.`);
            if (pwd === "12345678") {
                document.getElementById('loading-overlay').style.display = 'flex';
                document.querySelector('#loading-overlay div:nth-child(2)').innerText = '데이터 삭제 중...';

                const payload = {
                    action: 'delete',
                    timestamp: currentDetailItem.timestamp,
                    name: currentDetailItem.name,
                    program: currentDetailItem.program
                };

                fetch(GOOGLE_WEB_APP_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                }).then(res => res.json()).then(data => {
                    document.getElementById('loading-overlay').style.display = 'none';
                    if(data.status === 'success') { alert("✅ 삭제 완료"); document.getElementById('detail-modal').style.display = 'none'; openAdminPanel(); } 
                    else { alert("⚠️ 삭제 실패: " + data.message); }
                }).catch(err => { document.getElementById('loading-overlay').style.display = 'none'; alert("⚠️ 네트워크 오류"); });
            } else if (pwd !== null) { alert("비밀번호 불일치"); }
        }
    </script>
</body>
</html>
